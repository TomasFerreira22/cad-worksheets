<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Smart Greenhouse</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

  <nav class="navbar navbar-expand navbar-dark bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold" href="index.html"><i class="fa-solid fa-seedling"></i> Smart Greenhouse</a>
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link active" href="index.html">Dashboard</a></li>
      </ul>
    </div>
  </nav>

  <main class="container-fluid mt-3">

    <!-- Sensores -->
    <div class="row g-3">
      <div class="col-md-4">
        <section class="card h-100">
          <div class="card-body">
            <div class="text-secondary"><i class="fa-solid fa-temperature-half"></i> Temperature</div>
            <div class="fs-2 fw-bold text-success"><span id="temp-value">--</span> °C</div>
            <small id="temp-time" class="text-secondary">--</small>
          </div>
        </section>
      </div>
      <div class="col-md-4">
        <section class="card h-100">
          <div class="card-body">
            <div class="text-secondary"><i class="fa-solid fa-droplet"></i> Humidity</div>
            <div class="fs-2 fw-bold text-success"><span id="hum-value">--</span> %</div>
            <small id="hum-time" class="text-secondary">--</small>
          </div>
        </section>
      </div>
      <div class="col-md-4">
        <section class="card h-100">
          <div class="card-body">
            <div class="text-secondary"><i class="fa-solid fa-sun"></i> Luminosity</div>
            <div class="fs-2 fw-bold"><span id="lum-value">--</span> lux</div>
            <small id="lum-time" class="text-secondary">--</small>
          </div>
        </section>
      </div>
    </div>

    <!-- Atuadores -->
    <div class="row g-3 mt-1">
      <div class="col-md-4">
        <section class="card">
          <h5 class="card-header text-center fw-bold">Actuators</h5>
          <ul class="list-group list-group-flush">
            <li class="list-group-item d-flex justify-content-between align-items-center">
              <div>
                <strong><i class="fa-solid fa-fan"></i> Fan</strong>
                <span id="fan-badge" class="badge text-bg-secondary">OFF</span><br>
                <small id="fan-time" class="text-secondary">--</small>
              </div>
              <button id="fan-btn" type="button" class="btn btn-sm btn-outline-secondary">Turn on</button>
            </li>
            <li class="list-group-item d-flex justify-content-between align-items-center">
              <div>
                <strong><i class="fa-solid fa-faucet-drip"></i> Irrigation</strong>
                <span id="irrigation-badge" class="badge text-bg-secondary">OFF</span><br>
                <small id="irrigation-time" class="text-secondary">--</small>
              </div>
              <button id="irrigation-btn" type="button" class="btn btn-sm btn-outline-secondary">Turn on</button>
            </li>
          </ul>
        </section>
      </div>
    </div>

  </main>

  <script type="module" src="js/firebase.js"></script>
  <script type="module" src="js/index.js"></script>
</body>
</html>
